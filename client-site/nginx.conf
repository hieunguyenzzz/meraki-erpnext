server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy form submission to email-processor-v2 — only the one endpoint
    # this site calls (QuestionnaireForm.tsx). Do not widen to /api/.
    location = /api/client-questionnaire {
        proxy_pass http://email-processor-v2:8001/client-questionnaire;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Any other /api/* path is not exposed here.
    location /api/ {
        return 404;
    }
}
